name: Daily Ecosystem Pipelines & Failure Telemetry Renew

on:
  schedule:
    # 每日台北時間 08:00 (UTC 00:00) 自動掃描、分析連續失敗並更新
    - cron: "0 0 * * *"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "data/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-and-telemetry
  cancel-in-progress: false

jobs:
  telemetry-renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan Ecosystem Actions & Track Consecutive Schedule Failures
        env:
          GITHUB_TOKEN: ${{ secrets.ECOSYSTEM_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python scripts/scan_ecosystem_pipelines.py

      - name: Commit and push updated telemetry data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ README.md index.html
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): update ecosystem actions & schedule failure telemetry [skip ci]"
            git push
          fi

  deploy-pages:
    needs: telemetry-renew
    if: always() && (needs.telemetry-renew.result == 'success' || needs.telemetry-renew.result == 'skipped')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
